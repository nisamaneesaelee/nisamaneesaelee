<!DOCTYPE html>
<html>

<head>
    <title>Materials</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);

        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;

        document.body.appendChild(renderer.domElement);


        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);


        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);

        const controls = new THREE.OrbitControls(
            camera,
            renderer.domElement
        );


        // ไฟดวงเดียว
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);

        directionalLight.position.set(5, 10, 10);
        directionalLight.castShadow = true;

        directionalLight.shadow.camera.left = -6;
        directionalLight.shadow.camera.right = 6;
        directionalLight.shadow.camera.top = 6;
        directionalLight.shadow.camera.bottom = -6;

        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 30;

        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;

        directionalLight.shadow.bias = -0.0005;
        directionalLight.shadow.normalBias = 0.02;

        scene.add(directionalLight);

        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = new THREE.Color(0xffffff);
                scene.environment = skybox;
                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });


        const loader = new THREE.GLTFLoader();

        loader.load(
            'https://nisamaneesaelee.github.io/nisamaneesaelee/keykiki.glb',
            (gltf) => {
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(model);
            }
        );



        function animate(t) {
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {

        });

    </script>
</body>

</html>
