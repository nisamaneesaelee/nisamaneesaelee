<!DOCTYPE html>
<html>

<head>
    <title>Materials</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #portfolioUI {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .portfolioButton {
            pointer-events: auto;
            border: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: bold;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 16px;
        }

        #backButton {
            position: absolute;
            top: 25px;
            left: 25px;
            background: white;
            color: #333;
        }

        #slideControls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #prevButton,
        #nextButton {
            background: white;
            color: #333;
            font-size: 22px;
            width: 50px;
            height: 45px;
            padding: 0;
        }

        #pageNumber {
            background: white;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
        }

        #portfolioUI {
            display: none;
        }
    </style>
</head>

<body>

    <div id="portfolioUI">

        <button id="backButton" class="portfolioButton">
            ← BACK
        </button>


    </div>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);

        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;

        document.body.appendChild(renderer.domElement);


        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x094782);


        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        const portfolioUI = document.getElementById("portfolioUI");
        const backButton = document.getElementById("backButton");
        const prevButton = document.getElementById("prevButton");
        const nextButton = document.getElementById("nextButton");
        const pageNumber = document.getElementById("pageNumber");

        let currentSection = null;
        let currentSlide = 0;

        camera.position.set(0, 4, 10);

        const controls = new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

        controls.target.set(0, 4, 0);
        controls.update();

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let moving = false;
        let targetCameraPosition = new THREE.Vector3();
        let targetLookAt = new THREE.Vector3();

        const cameraPositions = {
            "Cube010": {
                position: new THREE.Vector3(1.5, 2, -1),
                lookAt: new THREE.Vector3(1.5, 2, -3)
            },

            "Cube016": {
                position: new THREE.Vector3(-1.5, 2, -1),
                lookAt: new THREE.Vector3(-1.5, 2, -3)
            },

            "Cube013": {
                position: new THREE.Vector3(-1.9, 1.7, 1.5),
                lookAt: new THREE.Vector3(-3, 1.5, 1.5)
            }
        };

        window.addEventListener('click', (event) => {

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                let object = intersects[0].object;

                while (object) {
                    console.log("กดโดน:", object.name);

                    if (cameraPositions[object.name]) {

                        targetCameraPosition.copy(
                            cameraPositions[object.name].position
                        );

                        targetLookAt.copy(
                            cameraPositions[object.name].lookAt
                        );

                        moving = true;
                        controls.enabled = false;

                        if (object.name === "Cube010") {
                            openPortfolio("about");
                        }

                        if (object.name === "Cube013") {
                            openPortfolio("skills");
                        }

                        if (object.name === "Cube016") {
                            openPortfolio("project");
                        }

                        break;
                    }

                    // ⭐ สำคัญมากกกก
                    object = object.parent;
                }
            }
        });


        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xfff4dc, 0.5);

        directionalLight.position.set(4, 8, 6);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -6;
        directionalLight.shadow.camera.right = 6;
        directionalLight.shadow.camera.top = 6;

        directionalLight.shadow.camera.bottom = -6;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 30;

        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.bias = -0.0005;
        directionalLight.shadow.normalBias = 0.02;
        scene.add(directionalLight);


        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader().setDataType(THREE.UnsignedByteType).load(exrSkyboxUrl, (texture) => {
            const skybox = pmremGenerator.fromEquirectangular(texture).texture;
            //scene.background = new THREE.Color(0xffffff);
            scene.environment = skybox;
            texture.dispose();
            pmremGenerator.dispose();
        }, undefined, (error) => {
            console.error('Unable to load EXR skybox:', error);
        });


        const loader = new THREE.GLTFLoader();

        loader.load(
            'https://nisamaneesaelee.github.io/nisamaneesaelee/key.glb',
            (gltf) => {
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                    if (child.name === "Cube065") {

                        const oldMaterial = child.material;

                        child.material = new THREE.MeshStandardMaterial({
                            color: oldMaterial.color
                                ? oldMaterial.color.clone()
                                : new THREE.Color(0xffffff),

                            map: oldMaterial.map || null,

                            roughness: 0.8,
                            metalness: 0
                        });
                    }
                });

                scene.add(model);

                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());


                const signLight = new THREE.SpotLight(0xffffaa, 2, 8, Math.PI / 3, 0.5, 1);


                // ตำแหน่งหลอดไฟ
                signLight.position.set(
                    1.5,   // X
                    4,     // Y สูงกว่าป้าย
                    -0.2   // Z อยู่ด้านหน้าป้าย
                );

                // จุดที่ไฟส่อง
                signLight.target.position.set(
                    1.5,   // X ตรงกับป้าย
                    2,     // Y ตรงกับป้าย
                    -1     // Z ตรงกับป้าย
                );

                scene.add(signLight);
                scene.add(signLight.target);
            }
        );


        function animate(t) {

            if (moving) {

                // ขยับกล้องไปยังตำแหน่งเป้าหมาย
                camera.position.lerp(
                    targetCameraPosition,
                    0.05
                );

                // หมุนกล้องให้มองเป้าหมาย
                camera.lookAt(targetLookAt);

                // เช็กว่าใกล้ถึงแล้ว
                if (camera.position.distanceTo(targetCameraPosition) < 0.05) {
                    camera.position.copy(targetCameraPosition);
                    camera.lookAt(targetLookAt);
                    controls.target.copy(targetLookAt);
                    moving = false;
                    controls.enabled = true;
                    controls.update(); // ⭐ เพิ่มบรรทัดนี้
                }
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }


        function openPortfolio(section) {
            currentSection = section;
            currentSlide = 0;
            portfolioUI.style.display = "block";
            updateSlide();
        }

        function updateSlide() {
            const sectionSlides = slides[currentSection];
            pageNumber.textContent = `${currentSlide + 1} / ${sectionSlides.length}`;
        }

        backButton.addEventListener("click", () => {
            // ซ่อนปุ่ม Portfolio
            portfolioUI.style.display = "none";
            // กลับไปตำแหน่งเริ่มต้น
            targetCameraPosition.set(-4, 3, 5);
            targetLookAt.set(-4, 2, 2);

            moving = true;
            controls.enabled = false;
        });

        animate();

    </script>
</body>

</html>
