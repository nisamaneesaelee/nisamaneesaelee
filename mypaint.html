<html>

<head>

    <title>Raster Graphics</title>

    <style>
        body {
            background-color: #FFF0F5;
            margin: 0;
            margin-top: 30px;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        canvas {
            border: 3px solid rgb(76, 44, 71);
            border-radius: 15px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
            background: white;
        }

        button {
            background-color: #f3cadc;
            border: 1px solid #f5b9dd;
            border-radius: 8px;
            width: 45px;
            height: 45px;
            font-size: 22px;
            cursor: pointer;
            margin-right: 8px;
        }

        button:hover {
            background-color: #FFC2DD;
        }

        /*ปุ่มที่ถูกเลือก*/
        .active {
            background-color: #FF8FB8;
            border: 2px solid #E75480;
        }

        label {
            margin-left: 12px;
            margin-right: 5px;
        }

        input[type="color"] {
            width: 45px;
            height: 45px;
            padding: 0;
            border: none;
            cursor: pointer;
            vertical-align: middle;

        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            width: fit-content;

            background: white;
            padding: 12px 18px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .app{
            display: inline-block;
        }
    </style>
</head>

<body>
    <div>
        <p><strong> ชื่อ-นามสกุล :</strong> นิศามณี แซ่ลี้ </p>
        <p><strong> รหัสนักศึกษา :</strong> 6721601320 </p>
        <p><strong> หมู่ :</strong> 700 </p>
        <p> มหาวิทยาลัยเกษตรศาสตร์กำแพงแสน </p>
    
        <div class="app">
            <div class="toolbar">

                <button id="pencilBtn" onclick="selecPencil()">✏️
                </button>

                <button id="eraserBtn" onclick="selecEraser()">🧽
                </button>

                <button id="clearBtn" onclick="clearCanvas()">🗑️
                </button>

                <button id="rectBtn" onclick="selectRect()">⬛️
                </button>

                <button id="circleBtn" onclick="selectCircle()">⚫️
                </button>

                <button id="lineBtn" onclick="selectLine()">📏
                </button>

                <button id="bucketBtn" onclick="selectBucket()">🪣
                </button>

            </div>

            <div class="toolbar">
                <button id="undo" onclick="undo()">↩️
                </button>

                <button id="redo" onclick="redo()">↪️
                </button>


                <label>Size ⚫️</label>
                <input type="range" min="1" max="100" value="1" oninput="
                    brushSize = Number(this.value);
                    document.getElementById('brushSizeValue').textContent = this.value;">
                <span id="brushSizeValue">1</span> px

                <label>🎨</label>
                <input type="color" id="colorPicker" value="#000000">

            </div>
            <br><br>

            <canvas id="canvas" width="800" height="500"></canvas>
        </div>

    </div>

    <script>

        //=====================================
        // Variables
        //=====================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data; // Array of color [R,G,B,A, R,G,B,A, ...]


        let isDragging = false;
        let previousMouseX = 0;
        let previousMouseY = 0;
        let startX = 0;
        let startY = 0;
        let r = 0;
        let g = 0;
        let b = 0;
        let currentTool = "pencil";
        let brushSize = 1;
        let saveImage = null;
        let previewData = null;
        let mouseX = 0;
        let mouseY = 0;
        let undoStack = [];
        let redoStack = [];


        //========================================
        //Pixel Functions
        //========================================
        function putPixel(x, y, r, g, b, a = 255) {
            if(
                x < 0 ||
                x >= canvas.width ||
                y < 0 ||
                y >= canvas.height
            ){
                return;
            }
            const idx = (y * canvas.width + x) * 4;

            data[idx] = r;
            data[idx + 1] = g;
            data[idx + 2] = b;
            data[idx + 3] = a;
        }
        function getPixel(x, y) {
            const idx = (y * canvas.width + x) * 4;
            return {
                r: data[idx],
                g: data[idx + 1],
                b: data[idx + 2],
                a: data[idx + 3]
            };
        }

        function putBrush(x, y, r, g, b, a = 255) {
            let radius = Math.floor(brushSize / 2);
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {

                    if (dx * dx + dy * dy <= radius * radius) {
                        putPixel(x + dx, y + dy, r, g, b, a);
                    }

                }
            }

        }

        //========================================
        //Draw Functions
        //========================================

        function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
            const dx = Math.abs(x2 - x1);
            const dy = Math.abs(y2 - y1);

            if (dx > dy) {
                const m = (y2 - y1) / (x2 - x1);
                const c = y1 - m * x1;
                for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
                    const y = Math.round(m * x + c);
                    putBrush(x, y, r, g, b, a);
                }
            } else {
                const m = (x2 - x1) / (y2 - y1);
                const c = x1 - m * y1;
                for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
                    const x = Math.round(m * y + c);
                    putBrush(x, y, r, g, b, a);
                }
            }
        }

        function drawRect(x1, y1, x2, y2, r, g, b, a = 255) {
            drawLine(x1, y1, x2, y1, r, g, b, a);
            drawLine(x2, y1, x2, y2, r, g, b, a);
            drawLine(x2, y2, x1, y2, r, g, b, a);
            drawLine(x1, y2, x1, y1, r, g, b, a);
        }

        function drawCircle(cx, cy, radius, r, g, b) {
            let x = radius;
            let y = 0;
            let decision = 1 - radius;

            while (y <= x) {

                putBrush(cx + x, cy + y, r, g, b);
                putBrush(cx + y, cy + x, r, g, b);

                putBrush(cx - y, cy + x, r, g, b);
                putBrush(cx - x, cy + y, r, g, b);

                putBrush(cx - x, cy - y, r, g, b);
                putBrush(cx - y, cy - x, r, g, b);

                putBrush(cx + y, cy - x, r, g, b);
                putBrush(cx + x, cy - y, r, g, b);

                y++;

                if (decision <= 0) {
                    decision += 2 * y + 1;
                } else {
                    x--;
                    decision += 2 * (y - x) + 1;
                }
            }
        }

        function drawEraserCursor(x, y) {
            ctx.save();

            ctx.beginPath();
            ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);

            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.fill();

            ctx.strokeStyle = "black";
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.restore();
        }

        //========================================
        //Preview Functions
        //========================================

        function cloneImageData(src) {
            return new ImageData(
                new Uint8ClampedArray(src.data),
                src.width,
                src.height
            );
        }

        function saveHistory() {
            undoStack.push(cloneImageData(imageData));

            redoStack = [];

            if (undoStack.length > 20) {
                undoStack.shift();
            }
        }

        function undo() {
            if (undoStack.length === 0) {
                return;
            }
            redoStack.push(cloneImageData(imageData));
            const previous = undoStack.pop();
            imageData.data.set(previous.data);
            redrawCanvas();
        }

        function redo() {
            if (redoStack.length === 0) {
                return;
            }
            undoStack.push(cloneImageData(imageData));
            const next = redoStack.pop();
            imageData.data.set(next.data);
            redrawCanvas();
        }
        function drawPreview(drawFunction) {
            imageData.data.set(saveImage.data);
            drawFunction();
            redrawCanvas();
        }

        function redrawCanvas() {
            ctx.putImageData(imageData, 0, 0);

            if (currentTool === "eraser") {
                drawEraserCursor(mouseX, mouseY);
            }
        }

        function sameColor(c1, c2) {
            return (
                c1.r === c2.r &&
                c1.g === c2.g &&
                c1.b === c2.b &&
                c1.a === c2.a
            );
        }

        //========================================
        //Flood Fill
        //========================================

        function floodFill(x, y, r, g, b) {
            const targetColor = getPixel(x, y);
            const newColor = {
                r: r,
                g: g,
                b: b,
                a: 255
            };
            if (sameColor(targetColor, newColor)) {
                return;
            }
            const queue = [];
            queue.push({
                x: x, y: y
            });
            while (queue.length > 0) {
                const current = queue.shift();
                //ไม่ให้เดินออกจากเฟรม
                if (
                    current.x < 0 ||
                    current.x >= canvas.width ||
                    current.y < 0 ||
                    current.y >= canvas.height
                ) { continue; }
                //เช็คสี
                const color = getPixel(current.x, current.y);
                //ถ้าไม่ใช่สีเดียวกับจุดแรก หยุด
                if (!sameColor(color, targetColor)) {
                    continue;
                }
                putPixel(current.x, current.y, r, g, b, 255);

                //ซ้าย ขวา ล่าง บน
                queue.push({
                    x: current.x + 1,
                    y: current.y
                });
                queue.push({
                    x: current.x - 1,
                    y: current.y
                });
                queue.push({
                    x: current.x,
                    y: current.y + 1
                });
                queue.push({
                    x: current.x,
                    y: current.y - 1
                });
            }
            redrawCanvas();

        }

        //=====================================
        // Mouse Function
        //=====================================

        function toScaledMouseCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: Math.floor((clientX - rect.left) * scaleX),
                y: Math.floor((clientY - rect.top) * scaleY)
            };
        }

        //=====================================
        // Mouse Even
        //=====================================

        canvas.addEventListener('mousedown', function (even) {
            const { x, y } = toScaledMouseCoords(even.clientX, even.clientY);

            if (
                currentTool == "pencil" ||
                currentTool == "eraser" ||
                currentTool == "line" ||
                currentTool == "rect" ||
                currentTool == "circle"
            ) {
                saveHistory();
            }

            switch (currentTool) {

                case "bucket":
                    floodFill(x, y, r, g, b);
                    return;

                case "pencil":
                    putBrush(x, y, r, g, b);
                    redrawCanvas();
                    break;

                case "eraser":
                    putBrush(x, y, 255, 255, 255);
                    redrawCanvas();
                    break;
            }
            isDragging = true;
            startX = x;
            startY = y;
            previousMouseX = x;
            previousMouseY = y;
            saveImage = cloneImageData(imageData);

        });

        canvas.addEventListener('mouseup', function (even) {
            isDragging = false;
            const { x, y } = toScaledMouseCoords(even.clientX, even.clientY);
            switch (currentTool) {
                case "rect":
                    drawRect(startX, startY, x, y, r, g, b);
                    break;
                case "line":
                    drawLine(startX, startY, x, y, r, g, b);
                    break;
                case "circle":
                    const radius = Math.round(Math.hypot(x - startX, y - startY));
                    drawCircle(startX, startY, radius, r, g, b);
                    break;
            }
            redrawCanvas();
        });

        canvas.addEventListener('mousemove', function (even) {
            const { x, y } = toScaledMouseCoords(even.clientX, even.clientY);

            mouseX = x;
            mouseY = y;

            if (isDragging) {
                if (currentTool === "pencil") {
                    drawLine(previousMouseX, previousMouseY, x, y, r, g, b, 255);
                    redrawCanvas();
                } else if (currentTool === "eraser") {
                    drawLine(previousMouseX, previousMouseY, x, y, 255, 255, 255, 255);
                    redrawCanvas();
                } else if (
                    currentTool === "rect" ||
                    currentTool === "line" ||
                    currentTool === "circle"
                ) {
                    drawPreview(() => {
                        switch (currentTool) {
                            case "rect":
                                drawRect(startX, startY, x, y, r, g, b);
                                break;
                            case "line":
                                drawLine(startX, startY, x, y, r, g, b);
                                break;
                            case "circle":
                                const radius = Math.round(Math.hypot(x - startX, y - startY));
                                drawCircle(startX, startY, radius, r, g, b);
                                break;
                        }
                        redrawCanvas();
                    });
                }

            }
            previousMouseX = x; //เก็บจุดล่าสุดไปเป็นจุดต่อไป
            previousMouseY = y;
            if (currentTool === "eraser") {
                redrawCanvas();
            }
        });

        canvas.addEventListener("mouseleave", () => {
            isDragging = false;
        });

        document.addEventListener("mouseup", () => {
            isDragging = false;
        });

        const toolButtons = [
            "pencilBtn",
            "eraserBtn",
            "rectBtn",
            "lineBtn",
            "circleBtn",
            "bucketBtn"
        ];

        //=====================================
        // Tool Functions
        //=====================================

        function clearActiveButton() {
            for (let i = 0; i < toolButtons.length; i++) {
                document.getElementById(toolButtons[i]).classList.remove("active");
            }
        }

        function selecPencil() {
            currentTool = "pencil";
            clearActiveButton();
            document.getElementById("pencilBtn").classList.add("active");

        }

        function selecEraser() {
            currentTool = "eraser";
            clearActiveButton();
            document.getElementById("eraserBtn").classList.add("active");

        }

        function selectRect() {
            currentTool = "rect";
            clearActiveButton();
            document.getElementById("rectBtn").classList.add("active");
        }

        function selectLine() {
            currentTool = "line";
            clearActiveButton();
            document.getElementById("lineBtn").classList.add("active");
        }

        function selectCircle() {
            currentTool = "circle";
            clearActiveButton();
            document.getElementById("circleBtn").classList.add("active");
        }

        function selectBucket() {
            currentTool = "bucket";
            clearActiveButton();
            document.getElementById("bucketBtn").classList.add("active");
        }

        //=====================================
        // Color Picker
        //=====================================

        const colorPicker = document.getElementById("colorPicker");
        colorPicker.addEventListener("input", function () {
            r = parseInt(this.value.substr(1, 2), 16);
            g = parseInt(this.value.substr(3, 2), 16);
            b = parseInt(this.value.substr(5, 2), 16);
        });

        //=====================================
        // Clear Canvas
        //=====================================

        function clearCanvas() {
            if (!confirm("ล้างภาพทั้งหมดหรือไม่ ?")) return;

            for (let x = 0; x < canvas.width; x++) {
                for (let y = 0; y < canvas.height; y++) {
                    putPixel(x, y, 255, 255, 255);
                }
            }
            redrawCanvas();
        }

        //=====================================
        // Initialize
        //=====================================

        selecPencil();

        ctx.putImageData(imageData, 0, 0);


    </script>

</body>

</html>
