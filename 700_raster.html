function drawLine(x1, y1, x2, y2, r, g, b, a = 255) {
  const dx = Math.abs(x2 - x1);
  const dy = Math.abs(y2 - y1);

  if(dx > dy) {
    const m = (y2 - y1) / (x2 - x1);
    const c = y1 - m * x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      putPixel(x, y, r, g, b, a);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      putPixel(x, y, r, g, b, a);
    }
  }
}

    drawLine(x2, y2, x1, y2, r, g, b, a);

}

function drawRectGradient(x1,y1,x2,y2,r1,g1,b1,r2,g2,b2,a=255){
    for(let y = y1; y <= y2; y++){
        let t = (y - y1) / (y2 - y1);//ปัจจจุบัน - จุดเริ่มต้น / จุดสิ้นสุด - จุดเริ่มต้น
        let r = Math.round(r1 * (1 - t) + r2 * t);
        let g = Math.round(g1 * (1 - t) + g2 * t);
        let b = Math.round(b1 * (1 - t) + b2 * t);
        for(let x = x1; x <= x2; x++){
            putPixel(x,y,r,g,b,a);
        }
    }
}

function drawEllipse(cx, cy, rx, ry, r, g, b, a=255){
    for(let y = -ry ; y <= ry ; y++){
        for(let x = -rx ; x <= rx ; x++){
            if((x*x)/(rx*rx) + (y*y)/(ry*ry) <= 1) //ตัดขอบสี่เหลรายมทำให้ได้รูปวงกลม
            {
                putPixel(cx + x, cy + y, r, g, b, a);
            }
        }
    }
}

function toScaledMouseCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: Math.floor((clientX - rect.left) * scaleX),
        y: Math.floor((clientY - rect.top) * scaleY)
    };
}

function drawSprite(sprite, x, y, r, g, b, a = 255) {
    for (let j = 0; j < sprite.length; j++) {
        for (let i = 0; i < sprite[j].length; i++) {
            if (sprite[j][i] === 1) {
                putPixel(x + i, y + j, r, g, b, a);
            }
        }
    }
}
function drawSpriteRotateScale(sprite, x, y, degree, scaleX, scaleY, is24Bit = false, r, g, b, a = 255){

    for(let j=0; j < sprite.length; j++){
        for (let i = 0; i < sprite[j].length; i++){
            
            let draw = false ;
            
            if(is24Bit){
                const color = sprite[j][i];
                if(color !== null){
                    r = (color >> 16) & 255;
                    g = (color >> 8) & 255;
                    b = color & 255
                    draw = true;
                }
            }else{

                if(sprite[j][i] === 1){
                    draw = true;
                }

            }
            if (draw) {
                //หาตรงกลางของยานแม่ แล้วเลื่อนรูป
                const cx = i - (sprite[j].length /2) ;
                const cy = j - (sprite.length /2) ;

                //Rotate
                const red = degree * (Math.PI / 180);
                const x_rot = Math.round(cx * Math.cos(red) - cy * Math.sin(red));
                const y_rot = Math.round(cx * Math.sin(red) + cy * Math.cos(red));

                //Scaled
                const x_scaled = Math.round(x_rot * scaleX);
                const y_scaled = Math.round(y_rot * scaleY);

                //Translate
                //const x_translated = Math.round(scaleX + x);
                //const y_translated = Math.round(scaleY + y);

                //putPixel(Math.round(x + x_scaled), Math.round(y + y_scaled), r, g, b, a);
                drawEllipse(x_scaled +x, y_scaled +y, Math.round(scaleX), Math.round(scaleY), r, g, b, a);
            }
        }
    }
}

    function drawSprite24Bit32x32(sprite, x, y) {
    for (let j = 0; j < sprite.length; j++) {
        for (let i = 0; i < sprite[j].length; i++) {
        const color = sprite[j][i];

        if (color !== null) {
            const r = (color >> 16) & 255;
            const g = (color >> 8) & 255;
            const b = color & 255;
            putPixel(x + i, y + j, r, g, b);
        }
        }
    }
    }

canvas.addEventListener('mousedown', function(even){
    isDragging = true;
    const{x, y} = toScaledMouseCoords(even.clientX, even.clientY);
    //console.log('mousedown', x, y); ไม่ได้ใช้
    putPixel(x, y, 0, 255, 0, 255);
    ctx.putImageData(imageData, 0, 0);
});

canvas.addEventListener('mouseup', function(even){
    isDragging = false;
    const{x, y} = toScaledMouseCoords(even.clientX, even.clientY);
    //console.log('mouseup', x, y);
    putPixel(x, y, 0, 0, 255, 255);
    ctx.putImageData(imageData, 0, 0);
});

canvas.addEventListener('mousemove', function(even){
    const{x, y} = toScaledMouseCoords(even.clientX, even.clientY);
    mouseX = x;
    mouseY = y;
    //console.log('mousemove', x, y);
    if(isDragging){
        drawLine(previousMousrX, previousMousrY, x, y, r, g, b, 255);
        //putPixel(x, y, 255, 180, 180, 255);
    }
    ctx.putImageData(imageData, 0, 0);

    previousMousrX = x; //เก็บจุดล่าสุดไปเป็นจุดต่อไป
    previousMousrY = y;
});

window.addEventListener('keydown', function(even){
    console.log('keydown', even.key);
    if(even.key === '1'){
        r=255; g=0; b=0;
    }else if(even.key === '2'){
        r=0; g=255; b=0;
    }else if(even.key === '3'){
        r=0; g=0; b=255;
    }else if(even.key === 'e'){
        r=255; g=255; b=255;
    }

    if(even.key === 'ArrowLeft'){
        degree -= 5 ;
    }else if(even.key === 'ArrowRight'){
        degree += 5 ;
    }

    if(even.key === 'ArrowUp'){
        scale += 0.1;
    }else if(even.key === 'ArrowDown'){
        scale -= 0.1;
    }

});

window.addEventListener('keyup', function(even){
    console.log('keyup', even.key);
});

    ctx.putImageData(imageData, 0, 0);

}
